[project]
name = "meeting-translate"
version = "0.4.0"
description = "Windows 会议实时翻译（日 ⇄ 中）：本地 ASR + GitHub Copilot 翻译，置顶双语字幕与会后纪要"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{ name = "Yang-Code01" }]
requires-python = ">=3.12"
dependencies = [
    "github-copilot-sdk>=1.0.20",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pycaw>=20260927",
    "pyside6-essentials>=6.12.0",
    "sherpa-onnx>=1.13.8",
    "sherpa-onnx-core==1.13.8",
    "soundcard>=0.4.6",
    "sounddevice>=0.5.6",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
